services:
  mongodb:
    image: mongo:latest
    command: ["mongod", "--bind_ip_all", "--port", "27017"]
    container_name: adele-mongodb
    restart: always
    ports:
      - "${MONGODB_PORT}:27017"
    volumes:
      #- ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - adele_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - backend_db

  adele-backoffice-frontend:
    build:
      context: ./Adele-Backoffice/backoffice-tre
      dockerfile: Dockerfile.frontend
    container_name: adele-backoffice-frontend
    ports:
      - "${BACKOFFICE_FRONTEND_PORT}:80"
    depends_on:
      - adele-backoffice-backend
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - backoffice_frontend_backend
    environment:
      - BACKEND_URL=http://localhost:${BACKOFFICE_FRONTEND_PORT}
    volumes:
      - ./Adele-Backoffice/backoffice-tre:/app


  adele-backoffice-backend:
    build:
      context: ./Adele-Backoffice/backend
      dockerfile: Dockerfile
    container_name: adele-backoffice-backend
    ports:
      - "${BACKOFFICE_BACKEND_PORT}:${BACKOFFICE_BACKEND_PORT}"
    env_file:
      - ./Adele-Backoffice/backend/.env
      - .env
    environment:
      - SHARED_DOCS_PATH=/documents
      - MINIO_ENDPOINT=tre-si-s3-1:9000
    volumes:
      - tre-shared-documents:/documents
      - ./Adele-Backoffice/backend:/backend
    depends_on:
      - mongodb
    networks:
      - backoffice_frontend_backend
      - backend_db
      - tre-core-priv
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${BACKOFFICE_BACKEND_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  adele-website-frontend:
    build:
      context: ./Adele-Website/TRE-BIODATA
      dockerfile: Dockerfile.frontend
    container_name: adele-website-frontend
    ports:
      - "${WEBSITE_FRONTEND_PORT}:80"
    env_file:
      - .env
    depends_on:
      - adele-website-backend
    networks:
      - website_frontend_backend
    volumes:
      - ./Adele-Website/TRE-BIODATA:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 5

  adele-website-backend:
    build:
      context: ./Adele-Website/backend
      dockerfile: Dockerfile
    container_name: adele-website-backend
    ports:
      - "${WEBSITE_BACKEND_PORT}:${WEBSITE_BACKEND_PORT}"
    env_file:
      - ./Adele-Website/backend/.env
      - .env
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - MINIO_ENDPOINT=tre-si-s3-1:9000
    depends_on:
      - mongodb
    networks:
      - website_frontend_backend
      - backend_db
      - tre-core-priv
    volumes:
      - ./Adele-Website/backend/config:/backend/config
      - ./Adele-Website/backend:/backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${WEBSITE_BACKEND_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  

volumes:
  adele_mongo_data:
  tre-shared-documents:

networks:
  backoffice_frontend_backend:
    driver: bridge
  backend_db:
    driver: bridge
  website_frontend_backend:
    driver: bridge
  tre-core-priv:
    external: true
